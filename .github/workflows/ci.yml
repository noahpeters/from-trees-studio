name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: from-trees-studio-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: npm ci
      - run: pip install -r requirements-dev.txt
      - run: npm run verify
      - run: npm run verify:assets
